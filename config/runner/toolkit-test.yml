toolkit:
  test:
    behat:
      from: behat.yml.dist
      to: behat.yml
      profile: default
      options: 'strict'
      commands:
        before: [ ]
        after: [ ]
    phpunit:
      options: ''
      execution: default
      from: phpunit.xml.dist
      to: phpunit.xml
      testsuite: ~
      group: ~
      covers: ~
      uses: ~
      filter: ~
      printer: EcEuropa\Toolkit\Tests\TestDurationPrinter
      commands:
        before: [ ]
        after: [ ]
    blackfire:
      uuid:
      pages:
        - '/'
        - '/user'
    phpcs:
      mode: phpcs
      config: phpcs.xml
      ignore_annotations: false
      show_sniffs: false
      standards:
        - ./vendor/drupal/coder/coder_sniffer/Drupal
        - ./vendor/drupal/coder/coder_sniffer/DrupalPractice
        - ./vendor/ec-europa/toolkit/phpcs/QualityAssurance
      ignore_patterns:
        - ${toolkit.build.dist.root}/
        - .cache/
        - vendor/
        - ${drupal.root}/
        - node_modules/
        - config/
        - '*.min.css'
        - '*.min.js'
      triggered_by:
        - php
        - module
        - inc
        - theme
        - profile
        - install
        - yml
      files:
        - ./${toolkit.build.custom-code-folder}
        - ./resources
        - ./src
    phpmd:
      config: phpmd.xml
      format: ansi
      ignore_patterns:
        - ${toolkit.build.dist.root}/
        - .cache/
        - vendor/
        - ${drupal.root}/
        - node_modules/
        - config/
      triggered_by:
        - php
        - module
        - inc
        - theme
        - install
      files:
        - ${toolkit.build.custom-code-folder}
        - src
    phpstan:
      config: phpstan.neon
      level: '6'
      includes:
        - vendor/mglaman/phpstan-drupal/extension.neon
        - vendor/mglaman/phpstan-drupal/rules.neon
        - vendor/phpstan/phpstan-deprecation-rules/rules.neon
      ignore_errors:
        - "#^Unsafe usage of new static#"
        - "#^PHPDoc tag @SuppressWarnings has invalid value#"
      files: [ ${toolkit.build.custom-code-folder}, src ]
      ignores: [ ${toolkit.build.dist.root}, .cache, vendor ]
      memory_limit: '-1'
      options: ''
  lint:
    eslint:
      config: .eslintrc.json
      packages: >-
        eslint@^8.57.1
        eslint-config-airbnb-base@^15.0.0
        eslint-config-drupal@^1.0.0
        eslint-config-prettier
        eslint-plugin-yml@^1.14.0
        eslint-junit
        eslint-plugin-jsdoc@^48.2.0
        eslint-plugin-prettier
        eslint-plugin-import@latest
        stylelint@^14.16.1
        stylelint-config-drupal@^3.1.0
      ignores: [ '${toolkit.build.dist.root}/*', '.cache/*', 'vendor/*', '${drupal.root}/*' ]
      extensions_yaml: [ '.yml', '.yaml' ]
      options_yaml: 'no-error-on-unmatched-pattern'
      extensions_js: [ '.js' ]
      options_js: 'no-error-on-unmatched-pattern'
      overrides:
        glob: ^10.3.10
        rimraf: ^5.0.5
    php:
      extensions: [ 'php', 'module', 'inc', 'theme', 'install' ]
      exclude: [ '${toolkit.build.dist.root}/', '.cache/', 'vendor/', '${drupal.root}/' ]
      options: ''
    css:
      config: .stylelintrc.json
      files: '"${toolkit.build.custom-code-folder}/themes/*/css/*.css" "!${toolkit.build.custom-code-folder}/themes/*/css/*.min.css"'
      options: 'allow-empty-input'
    cspell:
      config: '.cspell.json'
      files: '${toolkit.build.custom-code-folder}/'
      options: '--dot --gitignore'
    behat:
      config: 'gherkinlint.json'
      files: 'tests/features'
  axe-scan:
    config: axe-scan.config.json
    urls:
      - '/'
    file-path: axe-scan-urls.txt
    result-types: [ 'incomplete', 'violations' ]
    core-tags: [ 'wcag2a', 'wcag2aa', 'wcag21a', 'wcag21aa' ]
    locale: en
    result-file: axe-scan-results.csv
    allow-list: axe-scan-allowlist.csv
    run-summary: true
    summary-result-file: axe-scan-summary.csv
  run-tests:
    type: clone
    phpunit:
      clone: false
      clean: false
    behat:
      clone: true
      clean: true
    blackfire:
      clone: false
      clean: false
