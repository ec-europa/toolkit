- command: 'drupal:symlink-project'
  configuration: []
  resources: []
  expectations:
    - contains: "[error]  The '/__w/toolkit/toolkit/tests/sandbox/SymlinkProjectCommandsTest/composer.json' was not found."

- command: 'drupal:symlink-project'
  configuration:
    drupal:
      root: 'web'
    symlink_project:
      ignore: [ '.idea', 'vendor', 'ignored.txt', '.toolkit-mock' ]
  resources:
    - touch: example.txt
    - touch: example2.txt
    - touch: ignored.txt
    - mkdir: .git
    - file: composer.json
      content: |
        { "name": "drupal/example", "type": "drupal-module" }
  expectations:
    - contains: |
        [Simulator] Simulating Filesystem\FilesystemStack()
          ->remove('/__w/toolkit/toolkit/tests/sandbox/SymlinkProjectComma ... ules/custom/example')
          ->mkdir('/__w/toolkit/toolkit/tests/sandbox/SymlinkProjectComma ... ules/custom/example')
          ->symlink('/__w/toolkit/toolkit/tests/sandbox/SymlinkProjectCommandsTest/composer.json', '/__w/toolkit/toolkit/tests/sandbox/SymlinkProjectComma ... ample/composer.json')
          ->symlink('/__w/toolkit/toolkit/tests/sandbox/SymlinkProjectCommandsTest/example.txt', '/__w/toolkit/toolkit/tests/sandbox/SymlinkProjectComma ... example/example.txt')
          ->symlink('/__w/toolkit/toolkit/tests/sandbox/SymlinkProjectCommandsTest/example2.txt', '/__w/toolkit/toolkit/tests/sandbox/SymlinkProjectComma ... xample/example2.txt')
          ->symlink('/__w/toolkit/toolkit/tests/sandbox/SymlinkProjectCommandsTest/runner.yml', '/__w/toolkit/toolkit/tests/sandbox/SymlinkProjectComma ... /example/runner.yml')
    - not_contains: 'ignored.txt'
    - not_contains: '.git'

- command: 'drupal:symlink-project'
  configuration:
    drupal:
      root: 'build'
    symlink_project:
      ignore: [ '.idea', 'vendor', 'ignored.txt', '.toolkit-mock' ]
  resources:
    - touch: example.txt
    - touch: example2.txt
    - file: composer.json
      content: |
        { "name": "drupal/example", "type": "drupal-theme" }
  expectations:
    - contains: |
        [Simulator] Simulating Filesystem\FilesystemStack()
          ->remove('/__w/toolkit/toolkit/tests/sandbox/SymlinkProjectComma ... emes/custom/example')
          ->mkdir('/__w/toolkit/toolkit/tests/sandbox/SymlinkProjectComma ... emes/custom/example')
          ->symlink('/__w/toolkit/toolkit/tests/sandbox/SymlinkProjectCommandsTest/composer.json', '/__w/toolkit/toolkit/tests/sandbox/SymlinkProjectComma ... ample/composer.json')
          ->symlink('/__w/toolkit/toolkit/tests/sandbox/SymlinkProjectCommandsTest/example.txt', '/__w/toolkit/toolkit/tests/sandbox/SymlinkProjectComma ... example/example.txt')
          ->symlink('/__w/toolkit/toolkit/tests/sandbox/SymlinkProjectCommandsTest/example2.txt', '/__w/toolkit/toolkit/tests/sandbox/SymlinkProjectComma ... xample/example2.txt')
          ->symlink('/__w/toolkit/toolkit/tests/sandbox/SymlinkProjectCommandsTest/runner.yml', '/__w/toolkit/toolkit/tests/sandbox/SymlinkProjectComma ... /example/runner.yml')
