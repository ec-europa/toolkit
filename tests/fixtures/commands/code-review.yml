- command: toolkit:run-tests
  configuration: []
  resources: []
  expectations:
    - string_contains: PHPUnit      skip
    - string_contains: Behat        passed
    - string_contains: Blackfire    skip
    - string_contains: Components   passed

- command: toolkit:run-tests
  configuration:
    toolkit:
      run-tests:
        phpunit:
          clone: false
          clean: false
        behat:
          clone: true
          clean: true
        blackfire:
          clone: false
          clean: false
  resources: []
  expectations:
    - string_contains: PHPUnit      skip
    - string_contains: Behat        passed
    - string_contains: Blackfire    skip
    - string_contains: Components   passed

- command: toolkit:run-tests
  configuration:
    toolkit:
      run-tests:
        phpunit:
          clone: true
          clean: true
        behat:
          clone: true
          clean: true
        blackfire:
          clone: true
          clean: true
  resources: []
  expectations:
    - string_contains: PHPUnit      passed
    - string_contains: Behat        passed
    - string_contains: Blackfire    passed
    - string_contains: Components   passed

- command: toolkit:run-tests --type=clean
  configuration:
    toolkit:
      run-tests:
        type: clean
        phpunit:
          clone: false
          clean: false
        behat:
          clone: false
          clean: true
        blackfire:
          clone: false
          clean: false
  resources: []
  expectations:
    - string_contains: --profile=clean
    - string_contains: PHPUnit      skip
    - string_contains: Behat        passed
    - string_contains: Blackfire    skip
    - string_contains: Components   passed

- command: toolkit:run-tests
  configuration:
    toolkit:
      run-tests:
        phpunit:
          clone: false
        behat:
          clone: false
  resources: []
  expectations:
    - string_contains: "Tests are compulsory. You must enable at least one: behat or phpunit"

- command: toolkit:run-tests --type=clean
  configuration:
    toolkit:
      run-tests:
        phpunit:
          clean: false
        behat:
          clean: false
  resources: []
