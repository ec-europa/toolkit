- command: 'toolkit:setup-eslint'
  configuration: []
  resources:
    - from: sample-package.json
      to: package.json
    - from: sample-pnpm-lock.yaml
      to: pnpm-lock.yaml
    - from: sample-eslintrc.json
      to: .eslintrc.json
    - from: sample-prettierignore
      to: .prettierignore
    - mkdir: node_modules/.bin
    - touch: node_modules/.bin/eslint
  expectations:
    - string_contains: '>  No actions needed.'

