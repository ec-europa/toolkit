- command: 'toolkit:install-clean'
  configuration:
    toolkit:
      install:
        clean:
          commands:
            before:
              - task: exec
                command: echo "Hello!"
            after:
              - task: exec
                command: echo "Goodbye!"
  variables: []
  resources: []
  expectations:
    - contains: |
        [Simulator] Simulating EcEuropa\Toolkit\Task\Command\ConfigurationCommand(array ( ... ))
        [Simulator] Simulating Exec('/__w/toolkit/toolkit/run')
          ->arg('drupal:site-install')
        [Simulator] Running /__w/toolkit/toolkit/run 'drupal:site-install'
        [Simulator] Simulating EcEuropa\Toolkit\Task\Command\ConfigurationCommand(array ( ... ))

- command: 'toolkit:install-clean --config-file=core.extensions.yml'
  configuration:
    drupal:
      site:
        existing_config: true
  variables: []
  resources:
    - from: 'sample-core.extensions.yml'
      to: 'core.extensions.yml'
  expectations:
    - contains: |
        [Simulator] Simulating Exec('/__w/toolkit/toolkit/run')
          ->arg('drupal:site-install')
          ->option('existing-config')
        [Simulator] Running /__w/toolkit/toolkit/run 'drupal:site-install' --existing-config

