services:
  web:
    image: registry.dhs.tech.ec.europa.eu/digit/devsecops/httpd-php:8.3-ci
    working_dir: /__w/toolkit/toolkit
    ports:
      # Use port "8080:8080" to access the mock in the browser OR to use xdebug.
      - "8080"
#      - "8080:8080"
    volumes:
      - ${PWD}:/__w/toolkit/toolkit
#      - ${PWD}/resources/xDebug/xdebug.custom.ini:/etc/php/8.1/mods-available/xdebug.ini
    environment:
      DOCUMENT_ROOT: /__w/toolkit/toolkit
      VIRTUAL_HOST: localhost:8080
      NEXTCLOUD_USER:
      NEXTCLOUD_PASS:
      QA_API_AUTH_TOKEN:
      QA_WEBSITE_URL:
      TOOLKIT_MOCK_REPO:
      CI: false
      GITHUB_API_TOKEN:
      GITLAB_API_TOKEN:
      XDEBUG_CONFIG: client_host=host.docker.internal
      PHP_IDE_CONFIG: "serverName=Docker"
