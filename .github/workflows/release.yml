name: 'Documentation pipeline'

on:
  workflow_dispatch:
  workflow_call:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  Documentation:
    runs-on: ubuntu-latest
    container: registry.fpfis.eu/digit/devsecops/httpd-php:8.3-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Composer
        run: |
          composer validate
          composer install --prefer-dist--no-ansi --no-progress --no-interaction

      - name: Generate documentation
        run: ./vendor/bin/run toolkit:generate-documentation --token=${{ secrets.API_TOKEN }} --push || echo "skip"
